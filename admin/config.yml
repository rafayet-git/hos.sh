backend:
  name: github
  repo: rafayet-git/hos.sh
  branch: main
  base_url: https://sveltia-cms-auth1.rafayet-extras.workers.dev/

media_folder: "/assets"
public_folder: "/assets"

collections:
  - name: "posts"
    label: "Posts"
    folder: "_posts"
    media_folder: "/assets/posts"
    public_folder: "/assets/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Tags", name: "tags", widget: "string", required: false, hint: "Separate by spaces" }
      - { label: "Body", name: "body", widget: "markdown" }
  
  - name: "pages"
    label: "Pages"
    folder: "pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "select", options: ["default", "page"], default: "page" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
