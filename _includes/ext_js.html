<!-- JavaScript Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>

<!-- Mermaid: convert code blocks -->
{% if page.mermaid %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
<script>
document.querySelectorAll('div.language-mermaid, pre > code.language-mermaid').forEach(function (el) {
    var code = el.matches('code') ? el : el.querySelector('code');
    var pre = el.matches('code') ? el.parentNode : el;
    var div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    pre.replaceWith(div);
});
</script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';
var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
mermaid.initialize({
    startOnLoad: false,
    theme: dark ? 'dark' : 'default',
});
mermaid.run({ querySelector: '.mermaid' });
</script>
{% endif %}

<script src="/js/code-lang.js"></script>

<!-- MathJax -->
{% if page.mathjax %}
<script>
window.MathJax = {
    tex: {
        inlineMath: [['\\(','\\)'], ['$', '$']],
        displayMath: [['\\[','\\]'], ['$$','$$']],
    },
    options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
    }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
