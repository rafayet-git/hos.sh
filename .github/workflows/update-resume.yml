name: Update resume

on:
  # Sent by the resume repo when a new release is published
  repository_dispatch:
    types: [resume-updated]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch latest resume
        run: curl -fsSL -o assets/rh-resume.pdf https://github.com/rafayet-git/resume/releases/download/latest/rh-resume.pdf

      - name: Commit updated resume
        id: commit
        run: |
          if git diff --quiet -- assets/rh-resume.pdf; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/rh-resume.pdf
            git commit -m "Update resume"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run jekyll-gh-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
