media:
  input: assets
  output: /assets

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: layout, type: string, hidden: true, default: post }
      - { name: title, label: Title, type: string }
      - { name: date, label: Publish Date, type: date, options: { format: yyyy-MM-dd } }
      - { name: tags, label: Tags, type: string, required: false, description: Separate by spaces }
      - { name: body, label: Body, type: rich-text }

  - name: pages
    label: Pages
    type: collection
    path: pages
    filename: "{primary}.md"
    view:
      fields: [title, permalink]
      primary: title
    fields:
      - name: layout
        label: Layout
        type: select
        default: page
        options:
          values: [default, page]
      - { name: title, label: Title, type: string }
      - { name: permalink, label: Permalink, type: string }
      - { name: body, label: Body, type: rich-text }
